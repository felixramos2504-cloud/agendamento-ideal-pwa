<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c00000">
  <meta name="application-name" content="Agendamento Ideal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Agendamento Ideal">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Agendamento de Recebimento - Ideal Supermercado">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192-v6.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192-v6.png">

  <title>Agendamento Ideal</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f3f5f7;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    /* =========================
       SPLASH SCREEN
       ========================= */

    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #c00000;
      color: #ffffff;
      text-align: center;
      opacity: 1;
      visibility: visible;
      transition: opacity .45s ease, visibility .45s ease;
    }

    #splashScreen.ocultar {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-conteudo {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      animation: splashEntrada .8s ease-out;
    }

    .splash-logo {
      width: min(78vw, 320px);
      height: auto;
      display: block;
      object-fit: contain;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .28);
      animation: splashLogo 1.2s ease-in-out infinite alternate;
    }

    .splash-titulo {
      margin: 25px 0 0;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: .5px;
      line-height: 1.15;
    }

    .splash-subtitulo {
      margin: 9px 0 0;
      font-size: 15px;
      font-weight: 400;
      opacity: .92;
    }

    .splash-carregando {
      width: 120px;
      height: 3px;
      margin-top: 32px;
      background: rgba(255,255,255,.35);
      border-radius: 10px;
      overflow: hidden;
    }

    .splash-carregando::after {
      content: "";
      display: block;
      width: 45%;
      height: 100%;
      background: #ffffff;
      border-radius: 10px;
      animation: splashCarregando 1.2s ease-in-out infinite;
    }

    @keyframes splashEntrada {
      from {
        opacity: 0;
        transform: translateY(15px) scale(.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes splashLogo {
      from { transform: scale(1); }
      to { transform: scale(1.035); }
    }

    @keyframes splashCarregando {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(300%); }
    }

    /* =========================
       SISTEMA PRINCIPAL
       ========================= */

    #appFrame {
      display: block;
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      border: 0;
      background: #f3f5f7;
    }

    /* =========================
       TELA DE ERRO
       ========================= */

    #erro {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f3f5f7;
    }

    .erro-card {
      width: min(520px, 100%);
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      text-align: center;
    }

    .erro-card h1 {
      margin: 0 0 10px;
      color: #1f4e79;
      font-size: 22px;
    }

    .erro-card p {
      color: #667085;
      line-height: 1.5;
    }

    .erro-card button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      background: #1f4e79;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================
       CELULARES PEQUENOS
       ========================= */

    @media (max-width: 480px) {
      .splash-conteudo {
        padding: 24px;
      }

      .splash-logo {
        width: min(78vw, 270px);
        border-radius: 18px;
      }

      .splash-titulo {
        margin-top: 21px;
        font-size: 23px;
      }

      .splash-subtitulo {
        font-size: 14px;
      }

      .splash-carregando {
        margin-top: 28px;
      }
    }

    @media (max-height: 620px) {
      .splash-logo {
        width: min(55vw, 210px);
      }

      .splash-titulo {
        margin-top: 16px;
        font-size: 21px;
      }

      .splash-subtitulo {
        margin-top: 6px;
      }

      .splash-carregando {
        margin-top: 20px;
      }
    }
  </style>
</head>
