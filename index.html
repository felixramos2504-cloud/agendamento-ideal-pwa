<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agendamento IDEAL</title>

  <meta name="theme-color" content="#d71920">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #d71920;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      color: #d71920;
      font-size: 25px;
    }

    p {
      margin: 0 0 25px;
      color: #555;
      line-height: 1.4;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 10px;
      background: #d71920;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
    }

    .btn:active {
      transform: scale(.98);
    }
  </style>
</head>

<body>

  <div class="card">
    <img
      class="logo"
      src="./icon-192.png"
      alt="IDEAL Supermercados"
    >

    <h1>Agendamento IDEAL</h1>

    <p>
      Sistema de Agendamento de Recebimento
    </p>

    <a
      class="btn"
      href="https://script.google.com/macros/s/AKfycbyrvZJMrtHSJDitYf0XIYeXQRb9knLq7D2UZKVLRbgqx6El6Z9bbkGQK2tmOIkwjb1Wmw/exec"
    >
      Entrar no Agendamento
    </a>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
