<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Agendamento IDEAL</title>

  <meta name="theme-color" content="#d71920">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #d71920;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading {
      text-align: center;
      color: white;
    }

    .loading img {
      width: 130px;
      height: 130px;
      border-radius: 24px;
    }

    .loading p {
      margin-top: 18px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="loading">
    <img src="./icon-192.png" alt="IDEAL Supermercados">
    <p>Abrindo Agendamento IDEAL...</p>
  </div>

  <script src="./config.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }

    window.addEventListener("load", function () {
      if (window.APP_SCRIPT_URL) {
        window.location.href = window.APP_SCRIPT_URL;
      } else {
        document.querySelector(".loading p").textContent =
          "Não foi possível abrir o sistema.";
      }
    });
  </script>

</body>
</html>
