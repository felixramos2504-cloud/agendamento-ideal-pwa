<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Agendamento IDEAL</title>

  <meta name="theme-color" content="#E30613">
  <meta name="mobile-web-app-capable" content="yes">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #E30613;
    }

    /* =========================
       SISTEMA
       ========================= */

    #sistema {
      display: block;
      width: 100%;
      height: 100dvh;
      border: 0;
      background: #FFFFFF;
    }

    /* =========================
       TELA DE ABERTURA
       ========================= */

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        env(safe-area-inset-top)
        24px
        env(safe-area-inset-bottom);

      background: #E30613;

      transition:
        opacity .45s ease,
        visibility .45s ease;
    }

    #splash.saindo {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* =========================
       LOGO ANIMADO
       ========================= */

    .splash-logo {
      width: min(68vw, 360px);
      height: auto;
      display: block;

      animation:
        logoEntrada 1.35s
        cubic-bezier(.20,.80,.25,1)
        both;
    }

    @keyframes logoEntrada {

      0% {
        opacity: 0;
        transform: scale(.55);
      }

      60% {
        opacity: 1;
        transform: scale(1.06);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* CELULARES PEQUENOS */

    @media (max-width: 480px) {
      .splash-logo {
        width: min(72vw, 300px);
      }
    }

    /* TABLETS / DESKTOP */

    @media (min-width: 768px) {
      .splash-logo {
        width: min(42vw, 400px);
      }
    }

    /* ACESSIBILIDADE */

    @media (prefers-reduced-motion: reduce) {
      .splash-logo {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- ABERTURA IDEAL -->

  <div id="splash">
    <img
      class="splash-logo"
      src="./logo-splash.png"
      alt="IDEAL Supermercados"
    >
  </div>


  <!-- SISTEMA -->

  <iframe
    id="sistema"
    src="https://script.google.com/macros/s/AKfycbyrvZJMrtHSJDitYf0XIYeXQRb9knLq7D2UZKVLRbgqx6El6Z9bbkGQK2tmOIkwjb1Wmw/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>


  <script>
    const splash =
      document.getElementById("splash");

    const sistema =
      document.getElementById("sistema");

    let splashFinalizada = false;


    function fecharSplash() {

      if (splashFinalizada) return;

      splashFinalizada = true;

      /*
       * Pequena espera para permitir
       * que a animação termine.
       */

      setTimeout(function () {

        splash.classList.add("saindo");

        setTimeout(function () {
          splash.remove();
        }, 500);

      }, 1400);
    }


    /*
     * Quando o Apps Script carregar,
     * libera a abertura.
     */

    sistema.addEventListener(
      "load",
      fecharSplash
    );


    /*
     * Segurança:
     * não deixa a abertura presa
     * caso o iframe demore.
     */

    setTimeout(
      fecharSplash,
      3500
    );


    /*
     * SERVICE WORKER
     */

    if ("serviceWorker" in navigator) {

      navigator.serviceWorker
        .register("./service-worker.js")
        .catch(function (erro) {
          console.log(
            "Service Worker:",
            erro
          );
        });

    }
  </script>

</body>
</html>
